<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>👑 Admin — Flitry Management</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
        :root {
            --bg: linear-gradient(135deg,#0F0F23,#1A1A3A,#251640);
            --card: rgba(255,255,255,.04);
            --border: rgba(255,255,255,.12);
            --accent: linear-gradient(135deg,#EC4899,#6366F1);
            --green: linear-gradient(135deg,#10B981,#34D399);
            --red: linear-gradient(135deg,#EF4444,#F87171);
            --blue: linear-gradient(135deg,#3B82F6,#60A5FA);
            --gold: linear-gradient(135deg,#F59E0B,#FBBF24);
        }
        body{background:var(--bg);min-height:100vh;color:white;padding:20px}

        /* === TOP NAV === */
        .top{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:rgba(0,0,0,.4);border-radius:16px;border:1px solid var(--border);margin-bottom:24px;backdrop-filter:blur(10px)}
        .top h1{font-size:24px;background:linear-gradient(90deg,#FF6B9D,#9D65FF);-webkit-background-clip:text;color:transparent}
        .stats{display:flex;gap:20px}
        .stat{text-align:center}
        .stat span{display:block;font-size:22px;font-weight:bold;color:#FBBF24}
        .stat small{color:#888;font-size:12px}

        /* === TABS === */
        .tabs{display:flex;gap:10px;margin-bottom:20px}
        .tab{padding:12px 24px;border-radius:12px;border:none;background:rgba(255,255,255,.06);color:#ccc;cursor:pointer;font-weight:500;transition:all .2s}
        .tab.active{background:var(--accent);color:white}

        /* === CARDS & GRID === */
        .section{display:none}
        .section.active{display:block}
        .card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
        .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
        .user-basic{display:flex;gap:14px;align-items:center}
        .avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px}
        .user-meta h3{font-size:17px}
        .user-meta p{font-size:13px;color:#888;margin-top:2px}
        .badge{padding:4px 10px;border-radius:50px;font-size:12px;font-weight:bold}
        .badge.pending{background:rgba(251,191,36,.15);color:#FBBF24}
        .badge.approved{background:rgba(16,185,129,.15);color:#34D399}

        /* === PHOTO DISPLAY — BIGGER & CLEARER === */
        .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
        .photo-wrap{border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:#000;min-height:220px;display:flex;align-items:center;justify-content:center}
        .photo-wrap img{width:100%;height:100%;object-fit:cover}
        .photo-label{position:relative;top:0;left:0;background:rgba(0,0,0,.6);padding:8px 14px;border-radius:8px 8px 0 0;font-size:14px;font-weight:500;display:inline-block;margin-bottom:-1px}
        .no-photo{color:#555;padding:40px;text-align:center}

        /* === ACTION BUTTONS === */
        .btn-bar{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
        button{padding:12px 22px;border-radius:10px;border:none;font-weight:600;cursor:pointer;font-size:15px;transition:all .2s}
        button:hover{transform:translateY(-1px)}
        .btn-approve{background:var(--green);color:white;box-shadow:0 4px 12px rgba(16,185,129,.2)}
        .btn-reject{background:var(--red);color:white;box-shadow:0 4px 12px rgba(239,68,68,.2)}
        .btn-refresh{background:var(--blue);color:white}
        .btn-logout{background:rgba(255,255,255,.08);color:#aaa}

        /* === LOGIN SCREEN === */
        .login-wrap{max-width:440px;margin:80px auto}
        .login-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:20px;padding:30px}
        .login-card h2{text-align:center;margin-bottom:24px}
        input{width:100%;padding:15px;border-radius:10px;border:1px solid #333;background:#111522;color:white;margin-bottom:14px;font-size:15px}
        .btn-login{width:100%;padding:15px;border-radius:10px;border:none;background:var(--accent);color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:6px}
        .msg{margin-top:14px;padding:12px;border-radius:10px;text-align:center;font-size:14px;min-height:44px}
        .err{color:#F87171;background:rgba(239,68,68,.1)}
        .ok{color:#34D399;background:rgba(16,185,129,.1)}
        .empty{text-align:center;padding:60px 20px;color:#666}
        .empty svg{width:80px;height:80px;opacity:.3;margin-bottom:16px}
    </style>
</head>
<body>

<!-- === LOGIN SCREEN === -->
<div id="loginScreen">
    <div class="login-wrap">
        <div class="login-card">
            <h2>👑 Admin Control Panel</h2>
            <input type="email" id="adminEmail" placeholder="Admin Email Address">
            <input type="password" id="adminPass" placeholder="Admin Password">
            <button class="btn-login" onclick="adminLogin()">🔐 Sign In</button>
            <div id="loginMsg" class="msg"></div>
        </div>
    </div>
</div>

<!-- === ADMIN MAIN DASHBOARD === -->
<div id="adminScreen" style="display:none">
    <div class="top">
        <h1>👑 Flitry — Partner Management</h1>
        <div class="stats">
            <div class="stat"><span id="pendingCount">0</span><small>Pending Review</small></div>
            <div class="stat"><span id="approvedCount">0</span><small>Active Earners</small></div>
        </div>
        <button class="btn-refresh" onclick="loadData()">🔄 Refresh</button>
        <button class="btn-logout" onclick="logout()">🚪 Logout</button>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('pending')">⏳ Pending Approval</button>
        <button class="tab" onclick="switchTab('approved')">✅ Approved Earners</button>
    </div>

    <!-- === PENDING REVIEW — SEE ALL WOMEN APPLYING === -->
    <div id="pendingTab" class="section active">
        <div id="pendingList"></div>
    </div>

    <!-- === APPROVED EARNERS — WHO'S WORKING & EARNING === -->
    <div id="approvedTab" class="section">
        <div id="approvedList"></div>
    </div>
</div>

<script>
let adminCreds = { email: '', pass: '' };
let allUsers = [];

async function adminLogin() {
    const e = document.getElementById('adminEmail').value.trim();
    const p = document.getElementById('adminPass').value;
    if (!e || !p) return showLoginMsg('❌ Enter email & password', 'err');

    adminCreds.email = e;
    adminCreds.pass = p;
    await loadData();
}

async function loadData() {
    showLoginMsg('⏳ Loading...', 'ok');
    try {
        const res = await fetch('/admin/pending', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminEmail: adminCreds.email, adminPassword: adminCreds.pass })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Access Denied');

        // Save all users
        allUsers = data.pending || [];

        // Show admin screen
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminScreen').style.display = 'block';

        // Split into pending and approved
        const pending = allUsers.filter(u => !u.isApproved);
        const approved = allUsers.filter(u => u.isApproved);

        // Update stats
        document.getElementById('pendingCount').textContent = pending.length;
        document.getElementById('approvedCount').textContent = approved.length;

        // Render PENDING cards
        if (pending.length === 0) {
            document.getElementById('pendingList').innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><h3>✅ All caught up!</h3><p>No new applications to review</p></div>`;
        } else {
            document.getElementById('pendingList').innerHTML = pending.map(u => createCard(u, 'pending')).join('');
        }

        // Render APPROVED cards
        if (approved.length === 0) {
            document.getElementById('approvedList').innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M12.5 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg><h3>No approved earners yet</h3><p>Approve applications and they will appear here</p></div>`;
        } else {
            document.getElementById('approvedList').innerHTML = approved.map(u => createCard(u, 'approved')).join('');
        }

    } catch (err) {
        showLoginMsg('❌ ' + err.message, 'err');
    }
}

function createCard(u, mode) {
    const date = new Date(u.registeredAt).toLocaleString();
    return `
    <div class="card">
        <div class="card-header">
            <div class="user-basic">
                <div class="avatar">👩</div>
                <div class="user-meta">
                    <h3>@${u.username}</h3>
                    <p>${u.email} • Applied: ${date}</p>
                </div>
            </div>
            <span class="badge ${mode === 'pending' ? 'pending' : 'approved'}">${mode === 'pending' ? '⏳ Pending Review' : '✅ Active Earner'}</span>
        </div>

        <div class="photo-grid">
            <div>
                <span class="photo-label">📷 Government ID / Passport</span>
                <div class="photo-wrap">
                    ${u.passportPhoto ? `<img src="${u.passportPhoto}" alt="ID Photo">` : `<div class="no-photo">No photo uploaded</div>`}
                </div>
            </div>
            <div>
                <span class="photo-label">🤳 Selfie Verification</span>
                <div class="photo-wrap">
                    ${u.selfiePhoto ? `<img src="${u.selfiePhoto}" alt="Selfie Photo">` : `<div class="no-photo">No photo uploaded</div>`}
                </div>
            </div>
        </div>

        <div class="btn-bar">
            ${mode === 'pending' ? `
            <button class="btn-approve" onclick="approveUser('${u.id}')">✅ APPROVE — Activate Earner + 50 Coins</button>
            <button class="btn-reject" onclick="rejectUser('${u.id}')">❌ REJECT — Delete Application</button>
            ` : `
            <button class="btn-reject" onclick="rejectUser('${u.id}')">❌ Remove Earner</button>
            `}
        </div>
    </div>`;
}

async function approveUser(userId) {
    if (!confirm('✅ APPROVE THIS WOMAN?\n\nShe will become an active earner on Flitry.\n50 FREE coins will be added to her account.\n\nAre you sure?')) return;
    try {
        const res = await fetch('/admin/approve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminEmail: adminCreds.email, adminPassword: adminCreds.pass, userId })
        });
        const data = await res.json();
        if (data.success) {
            alert(`✅ SUCCESS!\n\n@${data.username} is now an ACTIVE EARNER!\nShe has been given 50 FREE coins.\n\nShe can now login and start earning.`);
            loadData();
        } else {
            alert('❌ ' + (data.error || 'Failed'));
        }
    } catch {
        alert('❌ Server error — try again');
    }
}

async function rejectUser(userId) {
    if (!confirm('❌ REJECT THIS APPLICATION?\n\nThis will DELETE her account permanently.\nShe will NOT be able to login.\n\nAre you sure?')) return;
    try {
        const res = await fetch('/admin/reject', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminEmail: adminCreds.email, adminPassword: adminCreds.pass, userId })
        });
        const data = await res.json();
        if (data.success) {
            alert(`❌ REJECTED\n\n@${data.username} has been removed.`);
            loadData();
        } else {
            alert('❌ ' + (data.error || 'Failed'));
        }
    } catch {
        alert('❌ Server error — try again');
    }
}

function switchTab(tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(tabName + 'Tab').classList.add('active');
}

function showLoginMsg(text, type) {
    const el = document.getElementById('loginMsg');
    el.className = 'msg ' + type;
    el.textContent = text;
}

function logout() {
    adminCreds = { email: '', pass: '' };
    document.getElementById('adminScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('adminEmail').value = '';
    document.getElementById('adminPass').value = '';
    document.getElementById('loginMsg').textContent = '';
}
</script>
</body>
</html>
