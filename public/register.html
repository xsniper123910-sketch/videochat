<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up — Flitry</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:linear-gradient(135deg,#0F0F23,#1A1A3A,#251640);min-height:100vh;color:white;display:flex;align-items:center;justify-content:center;padding:20px}
        .card{max-width:440px;width:100%;padding:30px;background:rgba(255,255,255,.03);border-radius:24px;border:1px solid rgba(255,255,255,.15)}
        h1{text-align:center;margin-bottom:6px;font-size:24px}
        .sub{text-align:center;color:#aaa;margin-bottom:24px;font-size:14px}
        .tabs{display:flex;gap:8px;margin-bottom:20px}
        .tab{flex:1;padding:12px;border-radius:10px;border:none;background:#222;color:white;cursor:pointer;font-weight:bold;font-size:13px}
        .tab.active{background:linear-gradient(135deg,#EC4899,#6366F1)}
        .section{display:none}
        .section.active{display:block}
        .box{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);border-radius:10px;padding:12px;margin-bottom:16px;font-size:13px;color:#C4B5FD}
        input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid #333;background:#111522;color:white;margin-bottom:12px;font-size:15px;outline:none}
        button{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#EC4899,#6366F1);color:white;font-size:16px;font-weight:bold;cursor:pointer}
        .msg{margin-top:12px;padding:10px;border-radius:8px;text-align:center;font-size:14px;min-height:40px}
        .err{color:#F87171;background:rgba(239,68,68,.1)}
        .ok{color:#34D399;background:rgba(16,185,129,.1)}
        .foot{text-align:center;margin-top:20px;color:#888;font-size:14px}
        .foot a{color:#A78BFA;text-decoration:none}
    </style>
</head>
<body>
    <div class="card">
        <h1>✨ Create Your Account</h1>
        <p class="sub">Select your role below</p>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('payer')">👨 Male</button>
            <button class="tab" onclick="switchTab('earner')">👩 Female</button>
            <button class="tab" onclick="switchTab('admin')">👑 Admin</button>
        </div>

        <!-- MALE / PAYER -->
        <div id="payer" class="section active">
            <div class="box">💙 Get <strong>100 FREE coins</strong> — instant approval!</div>
            <input type="text" id="u1" placeholder="Username">
            <input type="email" id="e1" placeholder="Email Address">
            <input type="password" id="p1" placeholder="Password (min 6 characters)">
            <input type="password" id="p1c" placeholder="Confirm Password">
            <button onclick="register('payer')">📝 Create Male Account</button>
            <div id="m1" class="msg"></div>
        </div>

        <!-- FEMALE / EARNER -->
        <div id="earner" class="section">
            <div class="box">💖 Account created after approval — usually within 24 hours.</div>
            <input type="text" id="u2" placeholder="Username">
            <input type="email" id="e2" placeholder="Email Address">
            <input type="password" id="p2" placeholder="Password (min 6 characters)">
            <input type="password" id="p2c" placeholder="Confirm Password">
            <button onclick="register('earner')">📝 Create Female Account</button>
            <div id="m2" class="msg"></div>
        </div>

        <!-- ADMIN -->
        <div id="admin" class="section">
            <div class="box">👑 Enter your Admin Code below</div>
            <input type="text" id="u3" placeholder="Admin Username">
            <input type="email" id="e3" placeholder="Email Address">
            <input type="password" id="code" placeholder="Admin Code">
            <input type="password" id="p3" placeholder="Password">
            <button onclick="register('admin')">👑 Create Admin Account</button>
            <div id="m3" class="msg"></div>
        </div>

        <p class="foot">Already have an account? <a href="login.html">Login →</a></p>
    </div>

<script>
function switchTab(role) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(role).classList.add('active');
}

function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.className = 'msg ' + type;
    el.textContent = text;
}

async function register(role) {
    let username, email, password, confirm, adminCode;
    let msgId = 'm1';

    if (role === 'payer') {
        username = document.getElementById('u1').value.trim();
        email = document.getElementById('e1').value.trim();
        password = document.getElementById('p1').value;
        confirm = document.getElementById('p1c').value;
        msgId = 'm1';
    } else if (role === 'earner') {
        username = document.getElementById('u2').value.trim();
        email = document.getElementById('e2').value.trim();
        password = document.getElementById('p2').value;
        confirm = document.getElementById('p2c').value;
        msgId = 'm2';
    } else if (role === 'admin') {
        username = document.getElementById('u3').value.trim();
        email = document.getElementById('e3').value.trim();
        adminCode = document.getElementById('code').value;
        password = document.getElementById('p3').value;
        confirm = password;
        msgId = 'm3';
    }

    // VALIDATION
    if (!username || !email || !password) return showMsg(msgId, '❌ Fill all fields', 'err');
    if (!email.includes('@') || !email.includes('.')) return showMsg(msgId, '❌ Enter valid email', 'err');
    if (password.length < 6) return showMsg(msgId, '❌ Password min 6 characters', 'err');
    if (password !== confirm) return showMsg(msgId, '❌ Passwords do not match', 'err');

    showMsg(msgId, '⏳ Creating account...', 'ok');

    try {
        const payload = { role, username, email, password };
        if (adminCode) payload.adminCode = adminCode;

        console.log('📤 Sending:', payload);

        const res = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const text = await res.text();
        console.log('📥 Raw response:', text);

        let data;
        try { data = JSON.parse(text); } 
        catch { return showMsg(msgId, '❌ Server returned invalid response', 'err'); }

        if (data.success) {
            showMsg(msgId, '✅ Account created! Redirecting...', 'ok');
            setTimeout(() => window.location = 'login.html', 2000);
        } else {
            showMsg(msgId, '❌ ' + (data.error || 'Failed'), 'err');
        }
    } catch (err) {
        console.error('❌ Fetch error:', err);
        showMsg(msgId, '❌ Cannot connect to server — check server status', 'err');
    }
}
</script>
</body>
</html>
