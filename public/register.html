<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Chat — Flitry</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:linear-gradient(135deg,#0F0F23,#1A1A3A,#251640);min-height:100vh;color:white}
        .top{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:rgba(0,0,0,.4);border-bottom:1px solid rgba(255,255,255,.1)}
        .logo{font-size:20px;font-weight:bold;background:linear-gradient(90deg,#FF6B9D,#9D65FF);-webkit-background-clip:text;color:transparent}
        .coins{background:linear-gradient(135deg,#FACC15,#F59E0B);color:black;padding:8px 16px;border-radius:50px;font-weight:bold;border:none;cursor:pointer}
        .vid-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;max-width:1100px;margin:0 auto}
        @media(max-width:768px){.vid-grid{grid-template-columns:1fr}}
        .vid-box{background:black;border-radius:16px;aspect-ratio:16/9;position:relative;overflow:hidden}
        video{width:100%;height:100%;object-fit:cover}
        .tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);padding:5px 12px;border-radius:20px;font-size:13px}
        .empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#666;text-align:center}
        .ctrls{display:flex;justify-content:center;gap:12px;padding:12px}
        .btn{padding:14px 24px;border-radius:50px;border:none;font-size:16px;font-weight:bold;cursor:pointer}
        .btn-green{background:linear-gradient(135deg,#10B981,#34D399);color:white}
        .btn-purple{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:white}
        .btn-red{background:linear-gradient(135deg,#EF4444,#F87171);color:white}
        .hidden{display:none!important}
        .status{text-align:center;padding:8px;color:#ccc}
        .hub{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
        .hub.show{display:flex}
        .hub-card{background:linear-gradient(180deg,#232352,#151535);border-radius:24px;padding:30px;max-width:460px;width:100%;border:2px solid rgba(139,92,246,.25)}
        .pack{background:rgba(255,255,255,.05);border-radius:12px;padding:16px;margin:10px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border:2px solid transparent}
        .pack:hover{border-color:rgba(139,92,246,.5)}
        .pack.popular{border-color:#FACC15}
        .price{color:#FACC15;font-weight:bold;font-size:20px}
        .close{width:100%;padding:12px;border-radius:10px;border:none;background:#374151;color:white;margin-top:15px;cursor:pointer}
    </style>
</head>
<body>

<!-- COIN HUB -->
<div id="hub" class="hub">
    <div class="hub-card">
        <h2 style="text-align:center;margin-bottom:20px">🪙 Buy Coins</h2>
        <div class="pack" onclick="buy('small')"><span>💰 100 Coins</span><span class="price">$4.99</span></div>
        <div class="pack popular" onclick="buy('medium')"><span>⭐ 500 Coins +50 FREE</span><span class="price">$19.99</span></div>
        <div class="pack" onclick="buy('large')"><span>💎 1,500 Coins +200 FREE</span><span class="price">$49.99</span></div>
        <div class="pack" onclick="buy('mega')"><span>👑 5,000 Coins +800 FREE</span><span class="price">$149.99</span></div>
        <button class="close" onclick="closeHub()">Close</button>
    </div>
</div>

<!-- TOP BAR -->
<div class="top">
    <div class="logo">FLITRY</div>
    <div style="display:flex;gap:12px;align-items:center">
        <span id="user" style="color:#aaa"></span>
        <button class="coins" onclick="openHub()">💰 <span id="count">0</span></button>
        <button onclick="localStorage.clear();location='login.html'" style="background:none;border:none;color:#888;cursor:pointer">Logout</button>
    </div>
</div>

<!-- VIDEO -->
<div class="vid-grid">
    <div class="vid-box">
        <span class="tag">You</span>
        <video id="local" autoplay muted playsinline></video>
        <div id="localStat" class="empty">📷 Camera loading...</div>
    </div>
    <div class="vid-box">
        <span class="tag">Partner</span>
        <video id="remote" autoplay playsinline></video>
        <div id="remoteStat" class="empty">👋 Click Find Partner</div>
    </div>
</div>

<div id="status" class="status"></div>

<div class="ctrls">
    <button id="findBtn" class="btn btn-green" onclick="find()">🔍 Find Partner</button>
    <button id="nextBtn" class="btn btn-purple hidden" onclick="next()">➡️ Next (10)</button>
    <button id="endBtn" class="btn btn-red hidden" onclick="end()">📞 End</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
let user=null,stream=null,pc=null,pid=null;
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};

window.onload=async()=>{
    const s=localStorage.getItem('user');
    if(!s){alert('⚠️ Login first!');return location='login.html'}
    user=JSON.parse(s);
    document.getElementById('user').textContent='@'+user.username;
    document.getElementById('count').textContent=user.coins||0;
    try{
        stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
        document.getElementById('local').srcObject=stream;
        document.getElementById('localStat').style.display='none';
    }catch{document.getElementById('localStat').textContent='⚠️ Camera blocked'}
};

async function find(){
    if((user.coins||0)<10)return alert('❌ Need 10 coins!')||openHub();
    status('⏳ Searching...');
    setBtns('wait');
    socket.emit('find',{username:user.username,email:user.email,role:user.role});
}
socket.on('wait',()=>status('⏳ Waiting for someone...'));
socket.on('found',async d=>{
    pid=d.partnerId;
    status('✅ Connected with '+d.name);
    document.getElementById('remoteStat').style.display='none';
    setBtns('call');
    await deduct(10);
    await startPC();
});

async function startPC(){
    pc=new RTCPeerConnection(ICE);
    stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    pc.ontrack=e=>document.getElementById('remote').srcObject=e.streams[0];
    pc.onicecandidate=e=>e.candidate&&socket.emit('signal',{to:pid,s:{c:e.candidate}});
    if(pid){const o=await pc.createOffer();await pc.setLocalDescription(o);socket.emit('signal',{to:pid,s:{o}})}
}
socket.on('signal',async d=>{
    pid=d.from;if(!pc)await startPC();
    if(d.s.o){await pc.setRemoteDescription(new RTCSessionDescription(d.s.o));const a=await pc.createAnswer();await pc.setLocalDescription(a);socket.emit('signal',{to:d.from,s:{a}})}
    else if(d.s.a)await pc.setRemoteDescription(new RTCSessionDescription(d.s.a));
    else if(d.s.c)await pc.addIceCandidate(new RTCIceCandidate(d.s.c));
});
async function next(){if((user.coins||0)<10)return alert('Need coins!');await deduct(10);end(true);setTimeout(find,300)}
function end(skip){pc&&pc.close();pc=null;skip||socket.emit('end');document.getElementById('remote').srcObject=null;document.getElementById('remoteStat').style.display='block';document.getElementById('remoteStat').textContent='👋 Call ended';status('');pid=null;setBtns('idle')}
socket.on('ended',()=>end());

async function deduct(amt){
    const r=await fetch('/deduct-coins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user.email,amount:amt})});
    const d=await r.json();
    if(d.success){user.coins=d.coins;document.getElementById('count').textContent=d.coins;localStorage.setItem('user',JSON.stringify(user))}
}
async function buy(pack){
    const r=await fetch('/buy-coins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user.email,pack})});
    const d=await r.json();
    if(d.success){user.coins=d.coins;document.getElementById('count').textContent=d.coins;localStorage.setItem('user',JSON.stringify(user));alert('✅ Coins added!')}
}
function status(t){document.getElementById('status').textContent=t}
function setBtns(s){
    document.getElementById('findBtn').classList.toggle('hidden',s!=='idle');
    document.getElementById('nextBtn').classList.toggle('hidden',s!=='call');
    document.getElementById('endBtn').classList.toggle('hidden',s!=='call');
}
function openHub(){document.getElementById('hub').classList.add('show')}
function closeHub(){document.getElementById('hub').classList.remove('show')}
</script>
</body>
</html>
