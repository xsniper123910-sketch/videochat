<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Flitry</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:linear-gradient(135deg,#0F0F23,#1A1A3A,#251640);min-height:100vh;color:white;display:flex;align-items:center;justify-content:center;padding:20px}
        .card{max-width:440px;width:100%;padding:30px;background:rgba(255,255,255,.03);border-radius:24px;border:1px solid rgba(255,255,255,.15)}
        h1{text-align:center;margin-bottom:6px;font-size:24px}
        .sub{text-align:center;color:#aaa;margin-bottom:24px;font-size:14px}
        input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid #333;background:#111522;color:white;margin-bottom:12px;font-size:15px}
        button{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#EC4899,#6366F1);color:white;font-size:16px;font-weight:bold;cursor:pointer}
        .msg{margin-top:12px;padding:10px;border-radius:8px;text-align:center;font-size:14px;min-height:40px}
        .err{color:#F87171;background:rgba(239,68,68,.1)}
        .ok{color:#34D399;background:rgba(16,185,129,.1)}
        .foot{text-align:center;margin-top:20px;color:#888;font-size:14px}
        .foot a{color:#A78BFA;text-decoration:none}
    </style>
</head>
<body>
    <div class="card">
        <h1>🔑 Welcome Back</h1>
        <p class="sub">Login to start video chatting</p>
        <input type="email" id="e" placeholder="Email Address">
        <input type="password" id="p" placeholder="Password">
        <button onclick="doLogin()">🔑 Login</button>
        <div id="m" class="msg"></div>
        <p class="foot">No account? <a href="register.html">Sign up free →</a></p>
    </div>

<script>
async function doLogin(){
    const e=document.getElementById('e').value.trim();
    const p=document.getElementById('p').value;
    if(!e||!e.includes('@')) return showMsg('❌ Enter valid email','err');
    if(p.length<6) return showMsg('❌ Enter password','err');
    
    try {
        const res=await fetch('/login',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({email:e,password:p})
        });
        const data=await res.json();
        if(data.success){
            localStorage.setItem('user',JSON.stringify(data.user));
            showMsg('✅ Login successful! Redirecting...','ok');
            setTimeout(()=>window.location='dashboard.html',1500);
        } else {
            showMsg('❌ '+(data.error||'Login failed'),'err');
        }
    } catch {
        showMsg('❌ Server error — try again','err');
    }
}
function showMsg(text,type){
    const el=document.getElementById('m');
    el.className='msg '+type;
    el.textContent=text;
}
</script>
</body>
</html>
