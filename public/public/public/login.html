<!DOCTYPE html>
<html>
<head>
    <title>Login — Flitry</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-box">
        <h1>🔑 Login</h1>
        <input type="email" id="e" placeholder="Email">
        <input type="password" id="p" placeholder="Password">
        <button onclick="doLogin()" class="btn primary full">Login</button>
        <div id="msg" class="msg"></div>
        <p class="link">No account? <a href="register.html">Register →</a></p>
    </div>

<script>
async function doLogin(){
    let e=document.getElementById('e').value.trim();
    let p=document.getElementById('p').value;
    let m=document.getElementById('msg');
    if(!e||!e.includes('@')) return m.innerHTML='<span class="err">❌ Enter valid email</span>';
    if(p.length<6) return m.innerHTML='<span class="err">❌ Enter password</span>';

    let r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
    let d=await r.json();
    if(d.success){
        localStorage.setItem('user',JSON.stringify(d.user));
        window.location='dashboard.html';
    }else m.innerHTML='<span class="err">'+d.error+'</span>';
}
</script>
</body>
</html>
