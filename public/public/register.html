<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Flitry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0F0F23 0%, #1A1A3A 50%, #251640 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            max-width: 440px;
            width: 100%;
            padding: 32px;
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .auth-card h1 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 26px;
        }

        .auth-sub {
            text-align: center;
            color: #aaa;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .role-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-tab {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        .role-tab.active {
            background: linear-gradient(135deg, #EC4899, #6366F1);
            box-shadow: 0 4px 15px rgba(99,102,241,0.3);
        }

        .form-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bonus-box, .info-box {
            background: rgba(99,102,241,0.1);
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #C4B5FD;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #111522;
            color: white;
            margin-bottom: 12px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #8B5CF6;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn-primary {
            background: linear-gradient(135deg, #EC4899, #6366F1);
            color: white;
        }

        .msg-box {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            min-height: 40px;
        }

        .msg-box.err {
            color: #F87171;
            background: rgba(239,68,68,0.1);
        }

        .msg-box.ok {
            color: #34D399;
            background: rgba(16,185,129,0.1);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }

        .auth-footer a {
            color: #A78BFA;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1>✨ Create Your Account</h1>
        <p class="auth-sub">Join today — get 100 FREE coins!</p>

        <!-- ROLE TABS -->
        <div class="role-tabs">
            <button class="role-tab active" id="tab-payer" onclick="switchRole('payer')">💎 I want to call</button>
            <button class="role-tab" id="tab-admin" onclick="switchRole('admin')">👑 Admin</button>
        </div>

        <!-- PAYER FORM -->
        <div id="payer-section" class="form-section active">
            <div class="bonus-box">🎉 <strong>100 FREE coins</strong> added instantly on signup!</div>
            <input type="text" id="p-user" placeholder="Username" required>
            <input type="email" id="p-email" placeholder="Email address" required>
            <input type="password" id="p-pass" placeholder="Password (min. 6 characters)" required>
            <button onclick="registerPayer()" class="btn btn-primary">📝 Create Free Account</button>
            <div id="p-msg" class="msg-box"></div>
        </div>

        <!-- ADMIN FORM -->
        <div id="admin-section" class="form-section">
            <div class="info-box">👑 Enter your secret Admin Code below to create an Admin account</div>
            <input type="text" id="a-user" placeholder="Admin Username">
            <input type="email" id="a-email" placeholder="Admin Email">
            <input type="password" id="a-code" placeholder="Secret Admin Code">
            <input type="password" id="a-pass" placeholder="Password (min. 6 characters)">
            <button onclick="registerAdmin()" class="btn btn-primary">👑 Create Admin Account</button>
            <div id="a-msg" class="msg-box"></div>
        </div>

        <p class="auth-footer">Already have an account? <a href="login.html">Login instead →</a></p>
    </div>

<script>
// Force default section to show on page load
document.addEventListener('DOMContentLoaded', function() {
    switchRole('payer');
});

function switchRole(role) {
    // Update tabs
    document.getElementById('tab-payer').classList.remove('active');
    document.getElementById('tab-admin').classList.remove('active');
    document.getElementById('tab-' + role).classList.add('active');

    // Update sections
    document.getElementById('payer-section').classList.remove('active');
    document.getElementById('admin-section').classList.remove('active');
    document.getElementById(role + '-section').classList.add('active');
}

function showMsg(el, text, type) {
    el.className = 'msg-box ' + type;
    el.textContent = text;
}

async function registerPayer() {
    const username = document.getElementById('p-user').value.trim();
    const email = document.getElementById('p-email').value.trim();
    const password = document.getElementById('p-pass').value;
    const msg = document.getElementById('p-msg');

    if (!username) return showMsg(msg, '❌ Enter a username', 'err');
    if (!email || !email.includes('@')) return showMsg(msg, '❌ Enter a valid email address', 'err');
    if (password.length < 6) return showMsg(msg, '❌ Password must be at least 6 characters', 'err');

    try {
        const res = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: 'payer', username, email, password })
        });
        const d = await res.json();

        if (d.success) {
            showMsg(msg, '✅ Account created! Taking you to login...', 'ok');
            setTimeout(() => window.location = 'login.html', 1800);
        } else {
            showMsg(msg, '❌ ' + (d.error || 'Registration failed — try again'), 'err');
        }
    } catch (err) {
        showMsg(msg, '❌ Server connection error — check if server is running', 'err');
    }
}

async function registerAdmin() {
    const username = document.getElementById('a-user').value.trim();
    const email = document.getElementById('a-email').value.trim();
    const code = document.getElementById('a-code').value;
    const password = document.getElementById('a-pass').value;
    const msg = document.getElementById('a-msg');

    if (!username || !email || !code || !password) return showMsg(msg, '❌ Fill in all fields', 'err');
    if (!email.includes('@')) return showMsg(msg, '❌ Enter a valid email address', 'err');
    if (password.length < 6) return showMsg(msg, '❌ Password must be at least 6 characters', 'err');

    try {
        const res = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: 'admin', username, email, password, adminCode: code })
        });
        const d = await res.json();

        if (d.success) {
            showMsg(msg, '👑 Admin account created! Taking you to login...', 'ok');
            setTimeout(() => window.location = 'login.html', 1800);
        } else {
            showMsg(msg, '❌ ' + (d.error || 'Registration failed'), 'err');
        }
    } catch (err) {
        showMsg(msg, '❌ Server connection error', 'err');
    }
}
</script>
</body>
</html>
